name: Build & Release

on:
  push:
    branches: [main]
    # Glob syntax, not a regex: "+" would be matched literally. The strict
    # semver check lives in the "meta" job below.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.2

jobs:
  # Resolves the version once so that every artifact is named consistently and
  # the release job knows whether this ref is a proper semver tag.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      cmake_version: ${{ steps.resolve.outputs.cmake_version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ $semver ]]; then
              echo "::error::Tag '$tag' is not a semantic version - refusing to release."
              exit 1
            fi
            version="${tag#v}"
            is_release=true
          else
            # Untagged builds still produce artifacts, just never a release.
            version="0.0.0-dev.${GITHUB_SHA::7}"
            is_release=false
          fi

          # project(VERSION) only accepts MAJOR.MINOR.PATCH, so strip any
          # pre-release and build-metadata part for CMake.
          cmake_version="$(echo "$version" | sed -E 's/[-+].*$//')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$cmake_version" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "Building $version (CMake version $cmake_version, release: $is_release)"

  build:
    needs: meta
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            qt_arch: win64_mingw
            qt_tools: tools_mingw1310
          - name: linux-x86_64
            os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - name: macos-arm64
            os: macos-14
            osx_arch: arm64

    env:
      # Exposed at job level so the steps below can test whether signing
      # credentials exist (secrets are absent on forked pull requests).
      WINDOWS_SIGNING_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libssl-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libfuse2 desktop-file-utils

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja nsis --no-progress -y

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          cache: true

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          if [ "$RUNNER_OS" = "Windows" ]; then g++ --version | head -1; else c++ --version | head -1; fi

      # curl is built from source by cpr and needs a TLS backend. Windows uses
      # Schannel; macOS and Linux use OpenSSL, which has to be pointed at
      # explicitly on macOS because it comes from Homebrew.
      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Generate bundle icon (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/logo.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/logo.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/AppIcon.icns

      - name: Configure
        shell: bash
        env:
          OSX_ARCH: ${{ matrix.osx_arch }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Visual Studio is also installed on the runner, so the MinGW
            # compilers that match the Qt build have to be requested explicitly.
            extra+=(-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++)
          fi
          if [ -n "${OSX_ARCH:-}" ]; then
            # Static OpenSSL keeps the bundle from depending on Homebrew paths
            # on the machines that download the release.
            extra+=("-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCH"
                    -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
                    -DOPENSSL_USE_STATIC_LIBS=ON)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBTEG_VERSION="${{ needs.meta.outputs.cmake_version }}" \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --parallel

      # ---------------------------------------------------------------- Windows
      # Qt cannot be linked statically from the official binary packages, so the
      # Qt runtime is compressed into one self-extracting executable rather than
      # shipping a folder full of DLLs.
      - name: Stage payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item build/bteginstaller.exe $payload/

          windeployqt --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw --no-compiler-runtime "$payload\bteginstaller.exe"

          # MinGW runtime, taken from the very compiler that built the app.
          $mingwBin = Split-Path (Get-Command g++).Source
          foreach ($dll in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
            Copy-Item (Join-Path $mingwBin $dll) $payload/
          }

      # Signed before packing, so the executable that actually runs on the
      # user's machine carries a signature as well as the download does.
      - name: Sign application (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ runner.temp }}\payload\bteginstaller.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BTE Germany Modpack Installer
          description-url: https://bte-germany.de

      - name: Build portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          $version = "${{ needs.meta.outputs.version }}"
          $name = "bteg-installer-$version-windows-x64.exe"
          $out = Join-Path $PWD $name

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }

          & $makensis -V2 `
            "-DPAYLOAD_DIR=$payload" `
            "-DOUT_FILE=$out" `
            "-DVERSION=$version" `
            "-DVERSION_QUAD=${{ needs.meta.outputs.cmake_version }}.0" `
            "-DICON_FILE=$(Join-Path $PWD 'assets\AppIcon.ico')" `
            packaging\windows\portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT=$name"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_INSTALLER=$out"

      # This is the file people download, so its signature is what Windows
      # SmartScreen builds a reputation for.
      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ env.WINDOWS_INSTALLER }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BTE Germany Modpack Installer
          description-url: https://bte-germany.de

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CLIENT_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature $env:WINDOWS_INSTALLER
          "status : $($sig.Status)"
          "signer : $($sig.SignerCertificate.Subject)"
          "stamp  : $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "installer signature is $($sig.Status)" }

      - name: Warn about unsigned Windows build
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CLIENT_ID == ''
        run: echo "::warning::No Artifact Signing secrets available - this Windows build is unsigned."

      # ------------------------------------------------------------------ Linux
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appdir=AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp build/bteginstaller "$appdir/usr/bin/"
          cp assets/logo.png "$appdir/usr/share/icons/hicolor/256x256/apps/bteginstaller.png"

          cat > "$appdir/usr/share/applications/bteginstaller.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=BTE Germany Modpack Installer
          Comment=Installs and updates the BTE Germany Minecraft modpack
          Exec=bteginstaller
          Icon=bteginstaller
          Categories=Game;
          Terminal=false
          DESKTOP

          # Each linuxdeploy plugin is released from its own repository.
          gh=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy             "$gh/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage             "$gh/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-qt             "$gh/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          # Nested AppImages cannot mount themselves inside the runner.
          export APPIMAGE_EXTRACT_AND_RUN=1

          name="bteg-installer-${{ needs.meta.outputs.version }}-linux-x86_64.AppImage"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT="$name"
          ./linuxdeploy \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/bteginstaller" \
            --desktop-file "$appdir/usr/share/applications/bteginstaller.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/256x256/apps/bteginstaller.png" \
            --plugin qt --output appimage
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ macOS
      - name: Deploy bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: macdeployqt build/bteginstaller.app -always-overwrite

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

          # Sign by the certificate's SHA-1 hash rather than by name: the name
          # has to match what is in the keychain exactly, and a stray newline in
          # a secret is enough for codesign to report "no identity found".
          identity="$(security find-identity -v -p codesigning "$keychain"             | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate holds no \"Developer ID Application\" identity."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign bundle (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          app=build/bteginstaller.app

          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Inside out: every nested binary first, the bundle itself last.
          find "$app/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 |
            xargs -0 -r -I {} codesign --force --timestamp --options runtime \
              --sign "$SIGN_IDENTITY" {}
          if [ -d "$app/Contents/Frameworks" ]; then
            find "$app/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 |
              xargs -0 -r -I {} codesign --force --timestamp --options runtime \
                --sign "$SIGN_IDENTITY" {}
          fi
          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name="bteg-installer-${{ needs.meta.outputs.version }}-macos-${{ matrix.osx_arch }}.dmg"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R build/bteginstaller.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "BTE Germany Modpack Installer" \
            -srcfolder "$staging" -ov -format UDZO "$name"
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$name"
          fi
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZATION_APPLE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit "$ARTIFACT" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$MACOS_TEAM_ID" \
            --wait
          xcrun stapler staple "$ARTIFACT"
          spctl --assess --type open --context context:primary-signature -vv "$ARTIFACT"

      - name: Warn about unsigned macOS build
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE == ''
        run: echo "::warning::No signing secrets available - this macOS build is unsigned."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    needs: [meta, build]
    if: needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: BTEG Modpack Installer ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
